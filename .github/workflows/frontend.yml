name: Frontend CI/CD

on:
  workflow_dispatch:  
  push:
    branches:
      - develop
    paths:
      - "web/**"
      - ".github/workflows/frontend.yml"

permissions:
  contents: read
  id-token: write

env:
  REGISTRY: ${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.ap-south-1.amazonaws.com
  IMAGE_NAME: shopkart/ecs-frontend
  IMAGE_TAG: ${{ github.sha }}

jobs:
  build-and-push:
    name: Build and Push Frontend
    runs-on: ubuntu-latest
    environment: development

    permissions:
      contents: read
      id-token: write

    steps:

      # Checkout
      - name: Checkout source
        uses: actions/checkout@v7


      # Dockerfile lint
      - name: Lint Dockerfile
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: web/Dockerfile
          failure-threshold: warning


      # Build Docker image
      - name: Build Docker image
        run: |
          echo "IMAGE_NAME=${IMAGE_NAME}"
          echo "IMAGE_TAG=${IMAGE_TAG}"

          docker build \
            -t "${IMAGE_NAME}:${IMAGE_TAG}" \
            web


      # Verify image exists locally
      - name: Verify Docker image
        run: |
          docker images "${IMAGE_NAME}"

          docker image inspect "${IMAGE_NAME}:${IMAGE_TAG}"


      # Configure AWS credentials
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6.2.4
        with:
          role-to-assume: arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID }}:role/github-action-ecr-role
          aws-region: ap-south-1
          audience: sts.amazonaws.com


      # Login to ECR
      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2


      # Push image
      - name: Tag image and push to ECR
        run: |
          ECR_IMAGE="${REGISTRY}/${IMAGE_NAME}:${IMAGE_TAG}"
          ECR_LATEST="${REGISTRY}/${IMAGE_NAME}:latest"

          echo "Local image:"
          echo "${IMAGE_NAME}:${IMAGE_TAG}"

          echo "ECR image:"
          echo "${ECR_IMAGE}"

          echo "ECR latest:"
          echo "${ECR_LATEST}"

          docker tag "${IMAGE_NAME}:${IMAGE_TAG}" "${ECR_IMAGE}"
          docker push "${ECR_IMAGE}"

          docker tag "${IMAGE_NAME}:${IMAGE_TAG}" "${ECR_LATEST}"
          docker push "${ECR_LATEST}"
