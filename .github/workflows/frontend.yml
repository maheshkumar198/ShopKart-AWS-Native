name: Frontend CI/CD

on:
  push:
    branches:
      - develop
    paths:
      - "web/**"
      - ".github/workflows/frontend.yml"

permissions:
  contents: read
  id-token: write

env:
  REGISTRY: ${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.ap-south-1.amazonaws.com
  IMAGE_NAME: shopkart/ecs-frontend
  IMAGE_TAG: ${{ github.sha }}

jobs:
  build-and-push:
    name: Build and Push Frontend
    runs-on: ubuntu-latest
    environment: development

    permissions:
      contents: read
      id-token: write

    steps:

      # --------------------------------------------------
      # Checkout
      # --------------------------------------------------
      - name: Checkout source
        uses: actions/checkout@v7


      # --------------------------------------------------
      # Dockerfile Lint
      # --------------------------------------------------
      - name: Lint Dockerfile
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: web/Dockerfile
          failure-threshold: warning


      # --------------------------------------------------
      # Build Docker Image
      # --------------------------------------------------
      - name: Build Docker image
        run: |
          echo "Building image:"
          echo "${IMAGE_NAME}:${IMAGE_TAG}"

          docker build \
            -t "${IMAGE_NAME}:${IMAGE_TAG}" \
            web


      # --------------------------------------------------
      # Verify Local Docker Image
      # --------------------------------------------------
      - name: Verify Docker image
        run: |
          docker images "${IMAGE_NAME}"


      # --------------------------------------------------
      # Configure AWS Credentials
      # --------------------------------------------------
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6.2.4
        with:
          role-to-assume: arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID }}:role/github-action-ecr-role
          aws-region: ap-south-1
          audience: sts.amazonaws.com


      # --------------------------------------------------
      # Login to Amazon ECR
      # --------------------------------------------------
      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2


      # --------------------------------------------------
      # Push Image to ECR
      # --------------------------------------------------
      - name: Tag image and push to ECR
        run: |
          ECR_IMAGE="${REGISTRY}/${IMAGE_NAME}:${IMAGE_TAG}"
          ECR_LATEST="${REGISTRY}/${IMAGE_NAME}:latest"

          echo "Pushing:"
          echo "${ECR_IMAGE}"
          echo "${ECR_LATEST}"

          docker tag "${IMAGE_NAME}:${IMAGE_TAG}" "${ECR_IMAGE}"
          docker push "${ECR_IMAGE}"

          docker tag "${IMAGE_NAME}:${IMAGE_TAG}" "${ECR_LATEST}"
          docker push "${ECR_LATEST}"